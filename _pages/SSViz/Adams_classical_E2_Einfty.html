<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Adams spectral sequence</title>
<style>
  :root {
    --bg: #fffddd;
    --text: #494e52;
    --muted: #7a8288;
    --border: #f2f3f3;
    --border-strong: #d6d9db;
    --link: #ac084a;        /* site link blue */
    --link-hover: #2d2f92;
    --surface: #fafafa;
    --dot: #000000;         /* Z/2 classes */
    --zbox: #2d2f92;        /* outline of the Z boxes (site link blue) */
    --diff: #c9503f;        /* differentials */
    --grid: #eceeef;        /* chart grid lines */
    --mult: #b4babe;        /* multiplication lines */
    --hidden2: #d00000;     /* hidden 2-extensions */
    --hiddeneta: #0057d9;   /* hidden eta-extensions */
    --hiddennu: #008a2e;    /* hidden nu-extensions */
    --d2: #c9503f;          /* d2 differentials */
    --d3: #7a3fc0;          /* d3 differentials */
    --d4: #0a8a8a;          /* d4 differentials */
    --sans: -apple-system, BlinkMacSystemFont, "Roboto", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }

  * { box-sizing: border-box; }
  html { font-size: 16px; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); line-height: 1.5; -webkit-font-smoothing: antialiased; }
  .page { max-width: 1240px; margin: 0 auto; padding: 1.25em 1.25em 2em; }
  h1 { font-size: 1.6em; line-height: 1.2; font-weight: 700; margin: 0 0 .8em; }
  sup, sub { line-height: 0; }

  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: .5em; margin-bottom: .6em; }
  .toolbar .hint { font-size: .85em; color: var(--muted); margin-left: .4em; }
  .btn {
    font: inherit; font-size: .875em; padding: .35em .85em; cursor: pointer;
    background: var(--bg); color: var(--text); border: 1px solid var(--muted); border-radius: 4px;
  }
  .btn:hover { background: var(--border); }
  .seg { display: inline-flex; }
  .seg button {
    font: inherit; font-size: .875em; padding: .35em .9em; background: var(--bg); color: var(--text);
    border: 1px solid var(--muted); margin-left: -1px; cursor: pointer;
  }
  .seg button:first-child { margin-left: 0; border-radius: 4px 0 0 4px; }
  .seg button:last-child { border-radius: 0 4px 4px 0; }
  .seg button[aria-pressed="true"] { background: var(--link); border-color: var(--link); color: #fff; position: relative; }
  .seg button:hover:not([aria-pressed="true"]) { background: var(--border); }
  .toolbar .gap { width: .6em; }
  [hidden] { display: none !important; }
  .btn.icon { min-width: 2.3em; font-weight: 700; }
  .btn.primary { background: var(--muted); color: #fff; border-color: var(--muted); }
  .btn.primary:hover { background: #565a5f; }
  button:focus-visible, input:focus-visible, #chart:focus-visible, .cls:focus-visible { outline: 2px solid var(--link-hover); outline-offset: 2px; }

  .chartwrap { border: 1px solid var(--border-strong); border-radius: 4px; background: #fff; overflow: hidden; }
  #chart { display: block; width: 100%; height: auto; cursor: grab; user-select: none; -webkit-user-select: none; }
  #chart.dragging { cursor: grabbing; }
  .cls { cursor: pointer; }

  .below { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 1em; margin-top: 1em; }
  .panel { background: var(--surface); border: 1px solid var(--border-strong); border-radius: 4px; padding: .8em 1em; }
  .key h2 { font-size: .8em; font-weight: 600; color: var(--muted); margin: 0 0 .35em; }
  .key .grp + .grp { margin-top: .7em; }
  .key label { display: flex; align-items: center; gap: .55em; font-size: .9em; cursor: pointer; padding: .1em 0; }
  .key svg { flex: none; }
  .exports { display: flex; flex-wrap: wrap; gap: .5em; margin-top: 1em; }

  #info { border-left: 4px solid var(--link); min-height: 7em; }
  #info .nm { font-size: 1.2em; font-weight: 700; margin-bottom: .3em; }
  #info dl { margin: 0; display: grid; grid-template-columns: 6.5em 1fr; gap: .15em .8em; font-size: .95em; }
  #info dt { color: var(--muted); }
  #info dd { margin: 0; }
  #info .hint { color: var(--muted); margin: 0; }

  @media (max-width: 760px) { .below { grid-template-columns: 1fr; } h1 { font-size: 1.35em; } }
  @media print { .toolbar, .exports, #info .hint { display: none; } .chartwrap { border: 0; } }
</style>
</head>
<body>
<main class="page">

  <h1>The classical Adams spectral sequence</h1>

  <div class="toolbar">
    <div class="seg" id="seg-page" role="group" aria-label="Page">
      <button type="button" data-page="E2" aria-pressed="false">E<sub>2</sub></button>
      <button type="button" data-page="E3" aria-pressed="false">E<sub>3</sub></button>
      <button type="button" data-page="E4" aria-pressed="false">E<sub>4</sub></button>
      <button type="button" data-page="Einf" aria-pressed="false">E<sub>∞</sub></button>
    </div>
    <span class="gap"></span>
    <button type="button" class="btn icon" id="zoom-in" aria-label="Zoom in">+</button>
    <button type="button" class="btn icon" id="zoom-out" aria-label="Zoom out">&minus;</button>
    <button type="button" class="btn" id="zoom-reset">Reset zoom</button>
    <span class="hint">Drag to move around. Zoom with the buttons, the + and &minus; keys, pinching, or Ctrl + scroll.</span>
  </div>

  <div class="chartwrap">
    <svg id="chart" tabindex="0" role="img" aria-label="Chart of the classical Adams spectral sequence through stem 43"></svg>
  </div>

  <div class="below">
    <div class="panel key">
      <div class="grp">
        <h2>Multiplication</h2>
        <label><input type="checkbox" data-kind="h0" checked><svg width="22" height="22"><line x1="11" y1="20" x2="11" y2="2" style="stroke:var(--mult);stroke-width:2"/></svg><span>h<sub>0</sub></span></label>
        <label><input type="checkbox" data-kind="h1" checked><svg width="22" height="22"><line x1="3" y1="19" x2="19" y2="3" style="stroke:var(--mult);stroke-width:2"/></svg><span>h<sub>1</sub></span></label>
        <label><input type="checkbox" data-kind="h2" checked><svg width="22" height="22"><line x1="1" y1="15" x2="21" y2="8" style="stroke:var(--mult);stroke-width:2"/></svg><span>h<sub>2</sub></span></label>
      </div>
      <div class="grp" id="grp-diff">
        <h2>Differentials</h2>
        <label data-for="d2"><input type="checkbox" data-kind="d2" checked><svg width="22" height="22"><line x1="16" y1="20" x2="8" y2="4" style="stroke:var(--d2);stroke-width:2"/><path d="M8 4 l0.5 6 l4.6 -2.4 z" style="fill:var(--d2)"/></svg><span>d<sub>2</sub></span></label>
        <label data-for="d3"><input type="checkbox" data-kind="d3" checked><svg width="22" height="22"><line x1="15" y1="20" x2="9" y2="3" style="stroke:var(--d3);stroke-width:2"/><path d="M9 3 l-0.2 6 l4.8 -1.8 z" style="fill:var(--d3)"/></svg><span>d<sub>3</sub></span></label>
        <label data-for="d4"><input type="checkbox" data-kind="d4" checked><svg width="22" height="22"><line x1="14" y1="20" x2="10" y2="2" style="stroke:var(--d4);stroke-width:2"/><path d="M10 2 l-0.9 6 l5 -1.2 z" style="fill:var(--d4)"/></svg><span>d<sub>4</sub></span></label>
      </div>
      <div class="grp" id="grp-hidden">
        <h2>Hidden extensions</h2>
        <label><input type="checkbox" data-kind="xh0" checked><svg width="22" height="22"><line x1="11" y1="20" x2="11" y2="2" style="stroke:var(--hidden2);stroke-width:2"/></svg><span>hidden 2-extension</span></label>
        <label><input type="checkbox" data-kind="xh1" checked><svg width="22" height="22"><line x1="3" y1="19" x2="19" y2="3" style="stroke:var(--hiddeneta);stroke-width:2"/></svg><span>hidden η-extension</span></label>
        <label><input type="checkbox" data-kind="xh2" checked><svg width="22" height="22"><line x1="1" y1="15" x2="21" y2="8" style="stroke:var(--hiddennu);stroke-width:2"/></svg><span>hidden ν-extension</span></label>
      </div>
      <div class="exports">
        <button type="button" class="btn" id="print">Print or save PDF</button>
        <button type="button" class="btn" id="download">Download SVG</button>
        <button type="button" class="btn" id="seqsee-json">Export SeqSee JSON</button>
        <button type="button" class="btn primary" id="seqsee-html">Export SeqSee HTML</button>
      </div>
    </div>
    <div class="panel" id="info" aria-live="polite"></div>
  </div>

</main>

          if (names.indexOf('twoZ') >= 0) el('text', { x: p.x, y: p.y + sd * 0.27, 'text-anchor': 'middle', 'font-size': sd * 0.78, 'font-weight': 700, fill: c }, g).textContent = '2';
        } else {
          el('circle', { cx: p.x, cy: p.y, r: r, fill: c, stroke: c, 'stroke-width': (a.thickness || 0) * scale }, g);
        }
        g.addEventListener('mouseenter', function () { hoverRaw = n.label || ''; hover.innerHTML = tex(n.label || ''); hover.style.visibility = n.label ? 'visible' : 'hidden'; });
      });

      var pad = 0.9 * scale;
      home = { x: X(xmin) - pad * 1.2, y: Y(ymax) - pad, w: (xmax - xmin) * scale + pad * 2.2, h: (ymax - ymin) * scale + pad * 2 };
      view = { x: home.x, y: home.y, w: home.w, h: home.h };
      apply();
      attachPanZoom();
    }

    function apply() { if (svg) svg.setAttribute('viewBox', view.x + ' ' + view.y + ' ' + view.w + ' ' + view.h); }
    function zoom(f, cx, cy) {
      if (cx == null) { cx = view.x + view.w / 2; cy = view.y + view.h / 2; }
      view.x = cx - (cx - view.x) / f; view.y = cy - (cy - view.y) / f; view.w /= f; view.h /= f; apply();
    }
    function toSvg(e) {
      var r = svg.getBoundingClientRect(), s = Math.max(view.w / r.width, view.h / r.height);
      var ox = (r.width * s - view.w) / 2, oy = (r.height * s - view.h) / 2;
      return { x: view.x - ox + (e.clientX - r.left) * s, y: view.y - oy + (e.clientY - r.top) * s, s: s };
    }
    function attachPanZoom() {
      var drag = null;
      svg.addEventListener('wheel', function (e) { e.preventDefault(); var p = toSvg(e); zoom(e.deltaY < 0 ? 1.15 : 1 / 1.15, p.x, p.y); }, { passive: false });
      svg.addEventListener('pointerdown', function (e) { drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y, s: toSvg(e).s }; svg.setPointerCapture(e.pointerId); });
      svg.addEventListener('pointermove', function (e) { if (!drag) return; view.x = drag.vx - (e.clientX - drag.x) * drag.s; view.y = drag.vy - (e.clientY - drag.y) * drag.s; apply(); });
      svg.addEventListener('pointerup', function () { drag = null; });
      svg.addEventListener('pointercancel', function () { drag = null; });
    }

    document.addEventListener('keydown', function (e) {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      var k = e.key;
      if (k === 'Escape' && charts.length > 1) { showIndex(); return; }
      if (k === 'w' || k === 'W') { if (current > 0) showChart(current - 1); else if (current < 0) showChart(0); return; }
      if (k === 's' || k === 'S') { if (current < charts.length - 1) showChart(current + 1); return; }
      if (!svg) return;
      var step = 0.1;
      if (k === '+' || k === '=') zoom(1.2);
      else if (k === '-' || k === '_') zoom(1 / 1.2);
      else if (k === '0' || k === 'Backspace') { view = { x: home.x, y: home.y, w: home.w, h: home.h }; apply(); }
      else if (k === 'ArrowLeft') { view.x -= view.w * step; apply(); }
      else if (k === 'ArrowRight') { view.x += view.w * step; apply(); }
      else if (k === 'ArrowUp') { view.y -= view.h * step; apply(); }
      else if (k === 'ArrowDown') { view.y += view.h * step; apply(); }
      else if (k === 'c' || k === 'C') { try { navigator.clipboard.writeText(hoverRaw); } catch (err) { /* ignore */ } }
      else return;
      e.preventDefault();
    });

    showIndex();
  }

  function seqseeHTML(json) {
    var title = (json.header.metadata.htmltitle || 'SeqSee chart').replace(/</g, '&lt;');
    var data = JSON.stringify(json).replace(/</g, '\\u003c');
    return '<!DOCTYPE html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n' +
      '<title>' + title + '</title>\n<style>\n' +
      'html,body{margin:0;height:100%;background:#fff;color:#000;font-family:"Latin Modern Roman","CMU Serif","Computer Modern",Georgia,"Times New Roman",serif;}\n' +
      '#app{position:fixed;inset:0;}\n' +
      '.chart{position:absolute;inset:0;width:100%;height:100%;cursor:grab;touch-action:none;}\n' +
      '.chart:active{cursor:grabbing;}\n' +
      '.top{position:absolute;top:12px;left:16px;z-index:2;pointer-events:none;}\n' +
      '.title{font-size:22px;}\n' +
      '.hover{visibility:hidden;display:inline-block;margin-top:6px;padding:4px 8px;border:1px solid #000;background:#fff;font-size:17px;}\n' +
      '.math i{font-style:italic;} .rm{font-style:normal;} .rm i{font-style:normal;}\n' +
      '.index{max-width:40em;margin:3em auto;padding:0 1.25em;}\n' +
      '.index h1{font-weight:400;font-size:28px;} .index li{font-size:20px;margin:.4em 0;}\n' +
      '.index a{color:#000;} .keys{color:#555;font-size:15px;margin-top:2em;}\n' +
      '</style>\n</head>\n<body>\n<div id="app"></div>\n<script>\nwindow.SEQSEE_DATA = ' + data + ';\n(' + seqseeRuntime.toString() + ')();\n<\/script>\n</body>\n</html>\n';
  }

  function save(text, type, name) {
    var blob = new Blob([text], { type: type });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }

  $('print').addEventListener('click', function () { window.print(); });
  $('download').addEventListener('click', function () {
    var svg = document.createElementNS(NS, 'svg');
    draw(svg, false, page);
    svg.setAttribute('xmlns', NS);
    svg.setAttribute('width', W); svg.setAttribute('height', H);
    save('<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(svg), 'image/svg+xml', 'Adams-classical-' + FILEPAGE[page] + '.svg');
  });
  $('seqsee-json').addEventListener('click', function () {
    save(JSON.stringify(buildSeqSee(), null, 2) + '\n', 'application/json', 'Adams-classical-seqsee.json');
  });
  $('seqsee-html').addEventListener('click', function () {
    save(seqseeHTML(buildSeqSee()), 'text/html', 'Adams-classical-seqsee.html');
  });

  window.__ssv = { buildSeqSee: buildSeqSee, seqseeHTML: seqseeHTML };

  setupPanZoom();
  setPage(START_PAGE);
})();
